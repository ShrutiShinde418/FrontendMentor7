<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./css/index.css" />

    <title>Frontend Mentor | Ping coming soon page</title>
  </head>
  <body>
    <main>
      <img src="./images/logo.svg" alt="Ping" class="logo-image" />
      <h1>We are launching <span>soon!</span></h1>
      <h2>Subscribe and get notified</h2>
      <form id="form">
        <input
          name="email"
          id="email"
          placeholder="Your email address..."
          class="input-control"
        />
        <button type="submit">Notify Me</button>
        <div class="error"></div>
      </form>
      <img
        src="./images/illustration-dashboard.png"
        alt="Dashboard illustration"
        class="illustration"
      />
    </main>
    <!-- image -->
    <footer>
      <div class="social">
        <a href="#"><i class="fa-brands fa-facebook-f fa-lg"></i></a>
        <a href="#"><i class="fa-brands fa-twitter fa-lg"></i></a>
        <a href="#"><i class="fa-brands fa-instagram fa-lg"></i></a>
      </div>
      <h3>&copy; Copyright Ping. All rights reserved.</h3>
      <p class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by
        <a href="https://github.com/ShrutiShinde418">Shruti Shinde</a>.
      </p>
    </footer>
    <script
      src="https://kit.fontawesome.com/db07eb4fcc.js"
      crossorigin="anonymous"
    ></script>
    <script src="./js/index.js"></script>
  </body>
</html>
